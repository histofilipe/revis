name: Reanime Cast APK
on:
  workflow_dispatch:
  push:
    branches: [reanime-cast-v0.1]
    paths:
      - 'ReanimeCast/**'
      - '.github/workflows/reanime-cast-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ReanimeCast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ReanimeCast-debug-apk
          path: ReanimeCast/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
